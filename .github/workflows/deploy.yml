name: CI

# Build, type-check and test every push and PR.
# The live site is deployed by Netlify (everydaygutwellness.com) only.
# GitHub Pages deployment was removed: it published a second copy of the
# site on github.io, which is duplicate content for search engines.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Validate TypeScript
        run: bun run typecheck

      - name: Run automated test suite
        run: bun run test

      - name: Build production assets & PDF
        run: bun run build
