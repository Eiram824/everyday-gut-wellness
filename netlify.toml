[build]
  command = "npm run build:client"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000"

# 1. API Route Redirects to Netlify Serverless Functions
[[redirects]]
  from = "/health"
  to = "/api/health"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/admin/verify"
  to = "/.netlify/functions/admin-verify"
  status = 200

[[redirects]]
  from = "/api/leads/export.csv"
  to = "/.netlify/functions/leads-export"
  status = 200

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/generate-content"
  to = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from = "/api/chat-message"
  to = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from = "/api/generate-images"
  to = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from = "/api/generate-videos"
  to = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from = "/api/videos-operation"
  to = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from = "/api/video-download"
  to = "/.netlify/functions/gemini"
  status = 200

# 2. Unknown API Endpoints Return JSON 404 (Prevents SPA fallback from swallowing API errors)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-not-found"
  status = 404

# 3. Standard Single Page Application Fallback for Frontend Pages
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

