[build]
  command = "npm run build:client"
  publish = "dist"
  functions = "netlify/functions"

[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true

[functions]
  node_bundler = "esbuild"

# 1. Canonical Domain Redirect (Netlify subdomain to primary domain)
[[redirects]]
  from = "https://everyday-gut-wellness.netlify.app/*"
  to = "https://everydaygutwellness.com/:splat"
  status = 301
  force = true

# 2. API Route Redirects to Netlify Serverless Functions
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/leads/export.csv"
  to = "/.netlify/functions/leads-export"
  status = 200

[[redirects]]
  from = "/api/admin/verify"
  to = "/.netlify/functions/admin-verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/gumroad-webhook"
  to = "/.netlify/functions/gumroad-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

# 2. Unknown API Endpoints Return JSON 404 (Prevents SPA fallback from swallowing API errors)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-not-found"
  status = 404

# 3. No SPA catch-all: the app uses #hash navigation, so unknown paths get
#    Netlify's real 404 response (public/404.html with status 404).

# Security headers for every page and file.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
