# 2. Unknown API Endpoints Return JSON 404 (Prevents SPA fallback from swallowing API errors)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-not-found"
  status = 404

# Static crawler resources always resolve to their actual files.
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# Only published routes receive a document rewrite. Unknown URLs retain 404s.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/fiber-guide"
  to = "/fiber-guide/index.html"
  status = 200

